# main 에 push → 빌드 → S3 업로드 → CloudFront 캐시 무효화
# 필요한 GitHub Secrets:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_S3_BUCKET, AWS_CLOUDFRONT_ID
# 필요한 GitHub Variables:
#   NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_ASSET_URL
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_ASSET_URL: ${{ vars.NEXT_PUBLIC_ASSET_URL }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # 해시가 붙은 _next/static 은 1년 캐시, 나머지(HTML·미디어)는 짧게
      - name: Upload to S3
        run: |
          aws s3 sync out/_next/static s3://${{ secrets.AWS_S3_BUCKET }}/_next/static --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync out/ s3://${{ secrets.AWS_S3_BUCKET }} --delete \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} --paths "/*"
